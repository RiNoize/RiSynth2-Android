name: Validate amber live UI Preview
on:
  push:
    branches: [codex/amber-hardware-ui-034]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amber-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply provided live UI patch and corrections
        run: |
          base64 --decode .ci/amber-patch.xz.b64 | xz --decompress > "$RUNNER_TEMP/amber.patch"
          git apply --check "$RUNNER_TEMP/amber.patch"
          git apply "$RUNNER_TEMP/amber.patch"
          rm .ci/amber-patch.xz.b64
          git diff --check
          grep "versionName '0.3.4'" android/app/build.gradle
          ! grep -R 'paint.setLetterSpacing' android/app/src/main/java/com/rinoize/risynth2/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: MIDI, favorites, import, monitor, control and CPU placement tests
        run: bash android/test-host.sh
      - name: DSP bit-exact audio regression
        run: bash android/test-engine.sh
      - name: Baseline-checked upstream regression
        run: bash android/test-upstream.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK / NDK / CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Restore pinned Preview signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/risynth2-ci
          key: risynth2-development-signing-v2
      - name: Verify pinned development certificate
        run: bash android/prepare-signing.sh
      - name: Build signed Preview and lint
        working-directory: android
        run: gradle --no-daemon -Prisynth2SideBySide=true :app:assembleRelease :app:lintRelease --stacktrace
      - name: Verify APK and package
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/RiSynth2-0.3.4-preview-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/*.apk | grep -E "package: name='com.rinoize.risynth2.preview' versionCode='7' versionName='0.3.4'"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RiSynth2-0.3.4-amber-preview-arm64
          path: dist/RiSynth2-0.3.4-preview-arm64.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amber-ui-validation
          path: |
            android/app/build/reports/
            dist/SHA256SUMS.txt
          if-no-files-found: ignore
      - name: Publish tested source to feature branch
        run: |
          test "$(git ls-remote origin refs/heads/codex/amber-hardware-ui-034 | cut -f1)" = "$GITHUB_SHA"
          git config user.name RiNoize
          git config user.email 70249646+RiNoize@users.noreply.github.com
          git add android ANDROID.md
          git diff --cached --check
          git commit -m "Implement amber live UI with favorites and pitch fixes [skip ci]"
          git push origin HEAD:refs/heads/codex/amber-hardware-ui-034
