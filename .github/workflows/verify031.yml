name: Validate audio 0.3.1
on:
  push:
    branches: ['codex/audio-031']
permissions:
  contents: read
concurrency:
  group: audio-031-validation
  cancel-in-progress: true
jobs:
  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact reviewed changes
        run: python3 .ci/apply031.py
      - name: Native ARM64 bit-exact audio and throughput
        run: bash android/test-engine.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RiSynth2-0.3.1-native-arm64-report
          path: android/app/build/reports/engine-performance.txt
          if-no-files-found: error
  build-preview:
    needs: native-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed source and record exact candidate
        run: |
          python3 .ci/apply031.py
          # The Actions token has contents permission, not workflows permission.
          # Final workflow changes are published separately by the repository connector.
          git restore -- .github/workflows/android.yml
          python3 -c "from pathlib import Path; p=Path('android/README.md'); s=p.read_text(); s=s.replace('Two APKs are included.', 'Preview and standard builds are separate artifacts, each containing one APK. Install Preview 0.3.1 over Preview 0.2.0 or 0.3.0 without uninstalling or reimporting.'); p.write_text(s)"
          git config user.name RiNoize
          git config user.email 70249646+RiNoize@users.noreply.github.com
          git add EngineCore android ANDROID.md
          git commit -m 'Optimize per-sample DSP in RiSynth2 0.3.1' -m 'Precompute exact Hermite coefficients, share global modulation, specialize oscillator dispatch and eliminate bounded ring-index divisions. Add native ARM64 comparisons against shipped 0.3.0 and component timing plus patch-bearing diagnostics. Preserve Preview identity, favorites and full synthesis quality.'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Favorites, import, MIDI and monitor tests
        run: bash android/test-host.sh
      - name: x86_64 bit-exact audio and throughput
        run: bash android/test-engine.sh
      - name: Original engine regressions with verified baseline exception
        run: bash android/test-upstream.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/risynth2-ci
          key: risynth2-development-signing-v2
      - name: Verify existing Preview signing key
        run: bash android/prepare-signing.sh
      - name: Build Preview APK and lint
        working-directory: android
        run: gradle --no-daemon -Prisynth2SideBySide=true :app:assembleRelease :app:lintRelease --stacktrace
      - name: Package only the Preview APK
        id: package
        run: |
          mkdir -p dist/preview
          cp android/app/build/outputs/apk/release/app-release.apk dist/preview/RiSynth2-0.3.1-preview-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/preview/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/preview/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/preview/*.apk | grep "package: name='com.rinoize.risynth2.preview' versionCode='4' versionName='0.3.1'"
          (cd dist/preview && sha256sum *.apk > SHA256SUMS.txt)
          cp dist/SIGNING-CERT-SHA256.txt dist/preview/
          git rev-parse HEAD > dist/preview/BUILD-COMMIT.txt
          git archive --format=tar.gz --output="${RUNNER_TEMP}/RiSynth2-0.3.1-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.package.outcome == 'success' }}
        with:
          name: RiSynth2-0.3.1-preview-arm64
          path: dist/preview/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.package.outcome == 'success' }}
        with:
          name: RiSynth2-0.3.1-source
          path: ${{ runner.temp }}/RiSynth2-0.3.1-source.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified source without changing workflow configuration
        run: |
          CURRENT="$(git ls-remote origin refs/heads/codex/audio-031 | cut -f1)"
          test "$CURRENT" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/audio-031
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RiSynth2-0.3.1-build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
