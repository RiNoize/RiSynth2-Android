name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['android/**', 'EngineCore/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'EngineCore/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  arm-regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Native ARM64 exact audio and throughput comparison
        run: bash android/test-engine.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-arm64-engine-report
          path: android/app/build/reports/engine-performance.txt
          if-no-files-found: error
  build:
    needs: arm-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact source for reproducible diagnostics
        run: git archive --format=tar.gz --output="${RUNNER_TEMP}/RiSynth2-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: RiSynth2-source-${{ github.sha }}
          path: ${{ runner.temp }}/RiSynth2-source.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: MIDI, import and engine smoke tests
        run: bash android/test-host.sh
      - name: Exact audio regression and host performance comparison
        run: bash android/test-engine.sh
      - name: Upstream regressions with exact original-baseline comparison
        run: bash android/test-upstream.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK, NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Restore explicit development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/risynth2-ci
          key: risynth2-development-signing-v2
      - name: Prepare and verify development signing key
        run: bash android/prepare-signing.sh
      - name: Build optimized ARM64 APK and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease --stacktrace
      - name: Build parallel APK without replacing 0.1.0
        working-directory: android
        run: |
          mkdir -p ../dist/standard ../dist/preview
          cp app/build/outputs/apk/release/app-release.apk ../dist/standard/RiSynth2-0.3.1-arm64.apk
          gradle --no-daemon -Prisynth2SideBySide=true :app:assembleRelease :app:lintRelease
          cp app/build/outputs/apk/release/app-release.apk ../dist/preview/RiSynth2-0.3.1-preview-arm64.apk
      - name: Package APK
        run: |
          for apk in dist/*/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          done
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/preview/RiSynth2-0.3.1-preview-arm64.apk | grep -E "^(package:|application-label:)"
          for dir in dist/standard dist/preview; do (cd "$dir" && sha256sum *.apk > SHA256SUMS.txt); done
      - uses: actions/upload-artifact@v4
        with:
          name: RiSynth2-0.3.1-preview-arm64
          path: dist/preview/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: RiSynth2-0.3.1-standard-arm64
          path: dist/standard/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
